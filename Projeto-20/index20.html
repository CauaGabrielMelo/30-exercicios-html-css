<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página com botões</title>
</head>
<body>
    <h2>Ações disponíveis</h2>

    <p>Clique em "Cadastrar" para adicionar um novo item ao sistema.</p>
    <button onclick="alert('Item cadastrado com sucesso!')">Cadastrar</button>

    <p>Clique em "Editar" para modificar um item já existente.</p>
    <button>Editar</button>

    <p>Clique em "Excluir" para remover um item do sistema.</p>
    <button>Excluir</button>

    <p>Clique em "Voltar" para retornar à página anterior.</p>
    <button>Voltar</button>
</body>
</html>
